name: TESTE - RUNNER SSH

on:
  workflow_dispatch:

jobs:
  teste-conexao:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Test Runner
        shell: bash
        run: |
           ssh -i "/home/ubuntu/.ssh/vm-ec2-default-key.pem" ubuntu@${{ secrets.EC2_PRIVATE_DNS }} << 'EOF'
           "
           pwd
           ls -la
           mkdir teste
           "
           EO

