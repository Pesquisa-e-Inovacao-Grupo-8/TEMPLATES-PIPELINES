name: ANALISE SONAR - PYTHON

on:
  workflow_call:
    inputs:
      GITHUB_REPOSITORY_NAME:
        description: "GitHub Repository Name"
        required: true
        type: string
        
      GITHUB_ORGANIZATION:
        description: "GitHub Organization Name"
        required: true
        type: string
        
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ANALISE-SONAR:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarCloud needs full history for accurate blame/analysis

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: pip

      - name: Verify Python
        run: python --version

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Set Sonar variables
        id: sonar_vars
        env:
          GITHUB_ORGANIZATION: ${{ inputs.GITHUB_ORGANIZATION }}
          GITHUB_REPOSITORY_NAME: ${{ inputs.GITHUB_REPOSITORY_NAME }}
        run: |
          ORG_LOWER=$(echo "$GITHUB_ORGANIZATION" | tr '[:upper:]' '[:lower:]')
          echo "org_lower=$ORG_LOWER" >> "$GITHUB_OUTPUT"
          echo "project_key=${ORG_LOWER}_${GITHUB_REPOSITORY_NAME}" >> "$GITHUB_OUTPUT"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ steps.sonar_vars.outputs.project_key }}
            -Dsonar.organization=${{ steps.sonar_vars.outputs.org_lower }}
            -Dsonar.sources=.
            -Dsonar.python.version=3.13