name: Destroy Infrastructure

on:
  workflow_dispatch:

jobs:

  destroy:

  terraform:

    runs-on: ubuntu-latest

    env:
      TF_VAR_account1_access_key: ${{ secrets.ACCOUNT1_ACCESS_KEY }}
      TF_VAR_account1_secret_key: ${{ secrets.ACCOUNT1_SECRET_KEY }}

    steps:

      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurando credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCOUNT1_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.ACCOUNT1_SECRET_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Iniciando Terraform
        working-directory: ./terraform
        run: terraform init

      - name: Destruindo recursos
        working-directory: ./terraform
        run: terraform destroy -auto-approve

     