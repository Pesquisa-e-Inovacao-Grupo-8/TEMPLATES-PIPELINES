name: Create Infrastructure

on:
  workflow_dispatch:

jobs:

  terraform:

    runs-on: ubuntu-latest

    env:
      TF_VAR_account1_access_key: ${{ secrets.ACCOUNT1_ACCESS_KEY }}
      TF_VAR_account1_secret_key: ${{ secrets.ACCOUNT1_SECRET_KEY }}

    steps:

      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurando credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCOUNT1_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.ACCOUNT1_SECRET_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Iniciando Terraform
        working-directory: ./terraform
        run: terraform init

      - name: Listar arquivos
        working-directory: ./terraform
        run: |
          pwd
          ls -la

      - name: Gerando plano
        working-directory: ./terraform
        run: terraform plan

      - name: Aplicando mudanças
        working-directory: ./terraform
        run: terraform apply -auto-approve

      - name: Instalar Ansible
        run: |

          sudo apt update

          sudo apt install ansible -y

      - name: Esperar SSH da EC2
        run: |
          IP="$(terraform -chdir=terraform output -raw ec2_public_ip)"
          PRIVATE_KEY="${GITHUB_WORKSPACE}/terraform/terraform-generated-key.pem"

          chmod 600 "$PRIVATE_KEY"
          echo "Esperando SSH em $IP"

          for i in {1..30}
          do
            if ssh \
              -o BatchMode=yes \
              -o ConnectTimeout=5 \
              -o ConnectionAttempts=1 \
              -o StrictHostKeyChecking=no \
              -i "$PRIVATE_KEY" \
              "ubuntu@$IP" "echo conectado"; then
              exit 0
            fi

            echo "SSH ainda indisponível (tentativa $i/30)."
            sleep 10
          done

          echo "A instância não ficou acessível por SSH em 5 minutos." >&2
          exit 1

      - name: Executar Ansible

        run: |

          ansible-playbook \
          -i ansible/inventory.ini \
          ansible/playbook.yml
