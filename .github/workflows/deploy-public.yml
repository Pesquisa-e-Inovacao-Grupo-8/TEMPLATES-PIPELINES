name: Deploy to EC2 - PUBLIC

on:
  workflow_call:
    inputs:
      GITHUB_REPOSITORY_NAME:
        description: "GitHub Repository Name"
        required: true
        type: string

      GITHUB_ORGANIZATION:
        description: "GitHub Organization Name"
        required: true
        type: string

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Test Runner
        run: |
          ssh -i "vm-ec2-default-key.pem" ubuntu@ec2${{ secrets.EC2_PUBLIC_IP }}.compute-1.amazonaws.com
          mkdir TESTE

