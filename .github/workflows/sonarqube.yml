name: SonarCloud analysis

on:
  workflow_call:
    inputs:
      GITHUB_REPOSITORY:
        description: "GitHub Repository Name"
        required: true
        type: string
      GITHUB_ORGANIZATION:
        description: "GitHub Organization Name"
        required: true
        type: string

    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java
        run: java -version

      - name: SonarCloud
        env:
          GITHUB_REPOSITORY: ${{ inputs.GITHUB_REPOSITORY }}
          GITHUB_ORGANIZATION: ${{ inputs.GITHUB_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          GITHUB_ORGANIZATION=$(echo "${{ inputs.GITHUB_ORGANIZATION }}" | tr '[:upper:]' '[:lower:]')

            echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
            echo "GITHUB_ORGANIZATION: $GITHUB_ORGANIZATION"
            echo "SONAR_PROJECT_KEY: ${GITHUB_ORGANIZATION}_$GITHUB_REPOSITORY"

          ./mvnw clean verify sonar:sonar \
            -Dsonar.projectKey="${GITHUB_ORGANIZATION}_${GITHUB_REPOSITORY}" \
            -Dsonar.organization="pesquisa-e-inovacao-grupo-8" \
            -Dsonar.token="$SONAR_TOKEN"

