name: SonarCloud analysis

on:
  workflow_call:
    inputs:
      sonar_project_key:
        description: "SonarCloud Project Key"
        required: true
        type: string

    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java
        run: java -version

      - name: SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw clean verify sonar:sonar \
            -Dsonar.projectKey="${{ inputs.sonar_project_key }}" \
            -Dsonar.organization="pesquisa-e-inovacao-grupo-8" \
            -Dsonar.token="$SONAR_TOKEN"