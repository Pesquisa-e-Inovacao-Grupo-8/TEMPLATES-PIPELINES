name: ANALISE SONAR - NODE

on:
  workflow_call:
    inputs:
      GITHUB_REPOSITORY_NAME:
        description: "GitHub Repository Name"
        required: true
        type: string

      GITHUB_ORGANIZATION:
        description: "GitHub Organization Name"
        required: true
        type: string

    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ANALISE-SONAR:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify Node.js
        run: node --version

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: FRONT-END-REACT
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_ORGANIZATION: ${{ inputs.GITHUB_ORGANIZATION }}
          GITHUB_REPOSITORY_NAME: ${{ inputs.GITHUB_REPOSITORY_NAME }}
          SONAR_PROJECT_KEY: ${{ inputs.GITHUB_ORGANIZATION }}_${{ inputs.GITHUB_REPOSITORY_NAME }}

      - name: Debug Sonar metadata
        run: |
          echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY_NAME"
          echo "GITHUB_ORGANIZATION: $(echo '${{ inputs.GITHUB_ORGANIZATION }}' | tr '[:upper:]' '[:lower:]')"
          echo "SONAR_PROJECT_KEY: ${{ inputs.GITHUB_ORGANIZATION }}_${{ inputs.GITHUB_REPOSITORY_NAME }}"




