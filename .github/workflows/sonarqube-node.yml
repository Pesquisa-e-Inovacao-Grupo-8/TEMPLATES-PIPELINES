name: ANALISE SONAR - NODE

on:
  workflow_call:
    inputs:
      GITHUB_REPOSITORY_NAME:
        description: "GitHub Repository Name"
        required: true
        type: string

      GITHUB_ORGANIZATION:
        description: "GitHub Organization Name"
        required: true
        type: string

    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ANALISE-SONAR:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify Node.js
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Prepare Sonar variables
        id: sonar
        env:
          GITHUB_ORGANIZATION: ${{ inputs.GITHUB_ORGANIZATION }}
          GITHUB_REPOSITORY_NAME: ${{ inputs.GITHUB_REPOSITORY_NAME }}
        run: |
          GITHUB_ORGANIZATION=$(echo "$GITHUB_ORGANIZATION" | tr '[:upper:]' '[:lower:]')

          SONAR_PROJECT_KEY="${GITHUB_ORGANIZATION}_${GITHUB_REPOSITORY_NAME}"

          echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY_NAME"
          echo "GITHUB_ORGANIZATION: $GITHUB_ORGANIZATION"
          echo "SONAR_PROJECT_KEY: $SONAR_PROJECT_KEY"

          echo "organization=$GITHUB_ORGANIZATION" >> "$GITHUB_OUTPUT"
          echo "project_key=$SONAR_PROJECT_KEY" >> "$GITHUB_OUTPUT"

      - name: SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ steps.sonar.outputs.project_key }}
            -Dsonar.organization=${{ steps.sonar.outputs.organization }}
            -Dsonar.host.url=https://sonarcloud.io