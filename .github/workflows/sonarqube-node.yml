name: ANALISE SONAR - NODE

on:
  workflow_call:
    inputs:
      GITHUB_REPOSITORY_NAME:
        description: "GitHub Repository Name"
        required: true
        type: string

      GITHUB_ORGANIZATION:
        description: "GitHub Organization Name"
        required: true
        type: string

    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ANALISE-SONAR:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify Node.js
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: SonarCloud
        uses: SonarSource/sonarcloud-github-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=$(echo "$GITHUB_ORGANIZATION" | tr '[:upper:]' '[:lower:]')_${{ inputs.GITHUB_REPOSITORY_NAME }}
            -Dsonar.organization=$(echo "$GITHUB_ORGANIZATION" | tr '[:upper:]' '[:lower:]')
            -Dsonar.host.url=https://sonarcloud.io
