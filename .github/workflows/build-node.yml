name: BUILD NODE - DOCKER

on:
  workflow_call:
    inputs:
      GITHUB_REPOSITORY_NAME:
        description: "GitHub Repository Name"
        required: true
        type: string

      GITHUB_ORGANIZATION:
        description: "GitHub Organization Name"
        required: true
        type: string

jobs:
  sonarqube:
    name: SonarCloud Analysis
    uses: Pesquisa-e-Inovacao-Grupo-8/TEMPLATES-PIPELINES/.github/workflows/sonarqube-node.yml@main
    with:
      GITHUB_REPOSITORY_NAME: ${{ inputs.GITHUB_REPOSITORY_NAME }}
      GITHUB_ORGANIZATION: ${{ inputs.GITHUB_ORGANIZATION }}
    secrets: inherit

  docker-qa:
    name: Docker Build - QA
    needs: sonarqube
    if: startsWith(github.ref, 'refs/heads/release/')
    uses: Pesquisa-e-Inovacao-Grupo-8/TEMPLATES-PIPELINES/.github/workflows/docker-build-qa.yml@main
    with:
      GITHUB_REPOSITORY_NAME: ${{ inputs.GITHUB_REPOSITORY_NAME }}
      GITHUB_ORGANIZATION: ${{ inputs.GITHUB_ORGANIZATION }}
    secrets: inherit

  deploy-qa:
    name: Deploy to EC2 - QA
    needs: docker-qa
    if: startsWith(github.ref, 'refs/heads/release/')
    uses: Pesquisa-e-Inovacao-Grupo-8/TEMPLATES-PIPELINES/.github/workflows/deploy-on-ec2-qa.yml@main
    with:
      GITHUB_REPOSITORY_NAME: ${{ inputs.GITHUB_REPOSITORY_NAME }}
      GITHUB_ORGANIZATION: ${{ inputs.GITHUB_ORGANIZATION }}
    secrets:
      EC2_DNS_QA: ${{ secrets.EC2_PUBLIC_DNS_QA }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}


  docker-prd:
    name: Docker Build - PRD
    needs: [sonarqube, deploy-qa]
    if: >-
      always() &&
      needs.sonarqube.result == 'success' &&
      (
        github.ref == 'refs/heads/main' ||
        (startsWith(github.ref, 'refs/heads/release/') && needs.deploy-qa.result == 'success')
      )
    uses: Pesquisa-e-Inovacao-Grupo-8/TEMPLATES-PIPELINES/.github/workflows/docker-build-prd.yml@main
    with:
      GITHUB_REPOSITORY_NAME: ${{ inputs.GITHUB_REPOSITORY_NAME }}
      GITHUB_ORGANIZATION: ${{ inputs.GITHUB_ORGANIZATION }}
    secrets: inherit

  deploy-prd:
    name: Deploy to EC2 - PRD
    needs: docker-prd
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    uses: Pesquisa-e-Inovacao-Grupo-8/TEMPLATES-PIPELINES/.github/workflows/deploy-on-ec2-prd.yml@main
    with:
      GITHUB_REPOSITORY_NAME: ${{ inputs.GITHUB_REPOSITORY_NAME }}
      GITHUB_ORGANIZATION: ${{ inputs.GITHUB_ORGANIZATION }}
    secrets:
      EC2_DNS_PRD: ${{ secrets.EC2_PUBLIC_DNS_PRD }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}