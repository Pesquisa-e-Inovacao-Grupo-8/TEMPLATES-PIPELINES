name: Build

on:
  workflow_call:
    inputs:
      sonar_project_key:
        description: "SonarCloud Project Key"
        required: true
        type: string

      sonar_organization:
        description: "SonarCloud Organization"
        required: true
        type: string

jobs:
  sonar:
    uses: Pesquisa-e-Inovacao-Grupo-8/TEMPLATES-PIPELINES/.github/workflows/sonarqube/node
    with:
      sonar_project_key: ${{ inputs.sonar_project_key }}
      sonar_organization: ${{ inputs.sonar_organization }}
    secrets: inherit
