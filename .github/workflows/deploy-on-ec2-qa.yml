name: DEPLOY ON EC2 - QA E PRD

on:
  workflow_call:
    inputs:
      GITHUB_REPOSITORY_NAME:
        description: "GitHub Repository Name"
        required: true
        type: string

      GITHUB_ORGANIZATION:
        description: "GitHub Organization Name"
        required: true
        type: string

    secrets:
      EC2_DNS_QA:
        description: "EC2 DNS QA"
        required: true

      DOCKERHUB_USERNAME:
        description: "Docker Hub Username"
        required: true
      
jobs:
  deploy-ec2-qa:
    if: github.ref != 'refs/heads/main'
    name: Deploy to EC2 - QA
    runs-on: vm-ec2-aws-qa
    steps:

      - name: Deploy Application
        shell: bash
        run: |
          ssh \
            -i "/home/ubuntu/.ssh/vm-key-pair-dev.pem" \
            -o StrictHostKeyChecking=no \
            ubuntu@${{ secrets.EC2_DNS_QA }} << 'EOF'

          PROJECT_DIR="/home/ubuntu/${{ inputs.GITHUB_REPOSITORY_NAME }}"

          if [ -d "$PROJECT_DIR" ]; then
            echo "Diretório já existe: $PROJECT_DIR"
          else
            echo "Diretório não existe. Criando..."
            mkdir -p "$PROJECT_DIR"
          fi

          cd "$PROJECT_DIR"

          USERNAME=$(echo -n "${{ secrets.DOCKERHUB_USERNAME }}" | tr -d '\r\n')
          REPOSITORY=$(echo -n "${{ inputs.GITHUB_REPOSITORY_NAME }}" | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')
          IMAGE="$USERNAME/$REPOSITORY-qa:${{ github.run_number }}"

          docker pull "$IMAGE"

          sed -i "s|image:.*|image: $IMAGE|g" docker-compose.yml

          sudo docker compose down
          sudo docker compose up -d

          EOF


