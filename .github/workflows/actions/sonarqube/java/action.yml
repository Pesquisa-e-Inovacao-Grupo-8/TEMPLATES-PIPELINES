name: SonarCloud Analysis - Java
description: Analyze a Java project using SonarCloud and Maven

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
        cache: maven

    - name: Verify Java
      shell: bash
      run: java -version

    - name: SonarCloud Analysis
      shell: bash
      env:
        SONAR_TOKEN: ${{ github.secrets.SONAR_TOKEN }}
        GITHUB_ORGANIZATION: ${{ github.repository_owner }}
        GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
      run: |
        set -euo pipefail

        chmod +x ./mvnw

        GITHUB_ORGANIZATION=$(echo "$GITHUB_ORGANIZATION" | tr '[:upper:]' '[:lower:]')

        echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY_NAME"
        echo "GITHUB_ORGANIZATION: $GITHUB_ORGANIZATION"
        echo "SONAR_PROJECT_KEY: ${GITHUB_ORGANIZATION}_${GITHUB_REPOSITORY_NAME}"
        echo "SONAR_PROJECT_NAME: $GITHUB_REPOSITORY_NAME"

        ./mvnw clean verify sonar:sonar \
          -Dsonar.projectKey="${GITHUB_ORGANIZATION}_${GITHUB_REPOSITORY_NAME}" \
          -Dsonar.projectName="$GITHUB_REPOSITORY_NAME" \
          -Dsonar.organization="$GITHUB_ORGANIZATION" \
          -Dsonar.token="$SONAR_TOKEN"
