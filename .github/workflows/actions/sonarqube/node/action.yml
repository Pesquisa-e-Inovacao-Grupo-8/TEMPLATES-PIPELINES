name: SonarCloud Analysis - Node.js
description: Analyze a Node.js project using SonarCloud

inputs:
  sonar_token:
    description: SonarCloud authentication token
    required: true

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm

    - name: Verify Node.js
      shell: bash
      run: node --version

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Prepare Sonar variables
      id: sonar
      shell: bash
      env:
        GITHUB_ORGANIZATION: ${{ github.repository_owner }}
        GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
      run: |
        set -euo pipefail

        GITHUB_ORGANIZATION=$(echo "$GITHUB_ORGANIZATION" | tr '[:upper:]' '[:lower:]')
        SONAR_PROJECT_KEY="${GITHUB_ORGANIZATION}_${GITHUB_REPOSITORY_NAME}"

        echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY_NAME"
        echo "GITHUB_ORGANIZATION: $GITHUB_ORGANIZATION"
        echo "SONAR_PROJECT_KEY: $SONAR_PROJECT_KEY"
        echo "SONAR_PROJECT_NAME: $GITHUB_REPOSITORY_NAME"

        echo "organization=$GITHUB_ORGANIZATION" >> "$GITHUB_OUTPUT"
        echo "project_key=$SONAR_PROJECT_KEY" >> "$GITHUB_OUTPUT"
        echo "project_name=$GITHUB_REPOSITORY_NAME" >> "$GITHUB_OUTPUT"

    - name: SonarCloud
      uses: SonarSource/sonarqube-scan-action@v6
      env:
        SONAR_TOKEN: ${{ inputs.sonar_token }}
      with:
        args: >
          -Dsonar.projectKey=${{ steps.sonar.outputs.project_key }}
          -Dsonar.projectName=${{ steps.sonar.outputs.project_name }}
          -Dsonar.organization=${{ steps.sonar.outputs.organization }}
          -Dsonar.host.url=https://sonarcloud.io