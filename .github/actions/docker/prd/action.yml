name: Build and Push - Docker Hub PRD
description: Build and push the production Docker image to Docker Hub

inputs:
  dockerhub_username:
    description: Docker Hub username
    required: true
  dockerhub_token:
    description: Docker Hub access token
    required: true

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: Build and Push Docker Image
      shell: bash
      env:
        DOCKERHUB_USERNAME: ${{ inputs.dockerhub_username }}
        REPOSITORY_NAME: ${{ github.event.repository.name }}
        RUN_NUMBER: ${{ github.run_number }}
      run: |
        set -euo pipefail

        REPOSITORY=$(echo -n "$REPOSITORY_NAME" | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')
        USERNAME=$(echo -n "$DOCKERHUB_USERNAME" | tr -d '\r\n')

        IMAGE="$USERNAME/$REPOSITORY-prd:$RUN_NUMBER"

        echo "Repository: $REPOSITORY"
        echo "Image: $IMAGE"

        docker build -t "$IMAGE" .
        docker push "$IMAGE"