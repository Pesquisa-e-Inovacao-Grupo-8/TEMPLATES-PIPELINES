
name: Deploy on EC2 - QA
description: Deploy Docker application on QA EC2

inputs:
  ec2_dns_qa:
    description: EC2 DNS QA
    required: true
  dockerhub_username:
    description: Docker Hub username
    required: true
  deploy_token:
    description: GitHub token to download docker-compose.yml
    required: true

runs:
  using: composite
  steps:
    - name: Deploy Application
      shell: bash
      env:
        EC2_DNS: ${{ inputs.ec2_dns_qa }}
        DOCKERHUB_USERNAME: ${{ inputs.dockerhub_username }}
        DEPLOY_TOKEN: ${{ inputs.deploy_token }}
        REPOSITORY: ${{ github.event.repository.name }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        RUN_NUMBER: ${{ github.run_number }}
      run: |
        set -euo pipefail

        REPOSITORY_LOWER=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')

        IMAGE="${DOCKERHUB_USERNAME}/${REPOSITORY_LOWER}-qa:${RUN_NUMBER}"

        if [[ ! "$IMAGE" =~ ^[a-z0-9._-]+/[a-z0-9._-]+:[a-zA-Z0-9._-]+$ ]]; then
          echo "::error::Invalid Docker image reference: $IMAGE"
          exit 1
        fi

        echo "Repository: $REPOSITORY_LOWER"
        echo "Image: $IMAGE"

        SSH_OPTS=(
          -i /home/ubuntu/.ssh/vm-key-pair-dev.pem
          -o StrictHostKeyChecking=no
        )

        REMOTE_DIR="/home/ubuntu/$REPOSITORY"

        ssh "${SSH_OPTS[@]}" "ubuntu@$EC2_DNS" \
          "mkdir -p '$REMOTE_DIR'"

        # Download docker-compose.yml if it does not exist remotely.
        if ! ssh "${SSH_OPTS[@]}" "ubuntu@$EC2_DNS" \
          "test -f '$REMOTE_DIR/docker-compose.yml'"; then

          curl -fsSL \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/docker-compose.yml" \
            | ssh "${SSH_OPTS[@]}" "ubuntu@$EC2_DNS" \
                "cat > '$REMOTE_DIR/docker-compose.yml"
        fi

        # Pass values safely to the remote shell.
        ssh "${SSH_OPTS[@]}" "ubuntu@$EC2_DNS" \
          bash -s -- "$REPOSITORY" "$IMAGE" <<'REMOTE'
        set -euo pipefail

        REPOSITORY="$1"
        IMAGE="$2"
        REMOTE_DIR="/home/ubuntu/$REPOSITORY"

        cd "$REMOTE_DIR"

        # Update the image in docker-compose.yml.
        IMAGE="$IMAGE" python3 - <<'PY'
        import os
        import re

        path = "docker-compose.yml"
        image = os.environ["IMAGE"]

        with open(path, encoding="utf-8") as f:
            content = f.read()

        updated, count = re.subn(
            r"(?m)^(\s*image:\s*).*$",
            lambda m: m.group(1) + image,
            content,
            count=1,
        )

        if count == 0:
            raise SystemExit("No image: entry found in docker-compose.yml")

        with open(path, "w", encoding="utf-8") as f:
            f.write(updated)
        PY

        docker pull "$IMAGE"
        sudo docker compose config
        sudo docker compose down
        sudo docker compose up -d
        REMOTE
