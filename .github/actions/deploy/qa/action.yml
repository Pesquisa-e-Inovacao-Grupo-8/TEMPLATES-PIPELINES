name: Deploy on EC2 - QA
description: Deploy Docker application on QA EC2

inputs:
  ec2_dns_qa:
    description: EC2 DNS QA
    required: true
  dockerhub_username:
    description: Docker Hub username
    required: true
  deploy_token:
    description: GitHub token to download docker-compose.yml
    required: true

runs:
  using: composite
  steps:
    - name: Deploy Application
      shell: bash
      env:
        EC2_DNS: ${{ inputs.ec2_dns_qa }}
        DOCKERHUB_USERNAME: ${{ inputs.dockerhub_username }}
        DEPLOY_TOKEN: ${{ inputs.deploy_token }}
        REPOSITORY: ${{ github.event.repository.name }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        RUN_NUMBER: ${{ github.run_number }}
      run: |
        set -euo pipefail

        REPOSITORY_LOWER=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')

        ssh \
          -i "/home/ubuntu/.ssh/vm-key-pair-dev.pem" \
          -o StrictHostKeyChecking=no \
          "ubuntu@$EC2_DNS" \
          "mkdir -p '/home/ubuntu/$REPOSITORY'"

        # Download docker-compose.yml if it does not exist remotely.
        ssh \
          -i "/home/ubuntu/.ssh/vm-key-pair-dev.pem" \
          -o StrictHostKeyChecking=no \
          "ubuntu@$EC2_DNS" \
          "test -f '/home/ubuntu/$REPOSITORY/docker-compose.yml'" \
          || curl -fsSL \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/docker-compose.yml" \
            | ssh \
                -i "/home/ubuntu/.ssh/vm-key-pair-dev.pem" \
                -o StrictHostKeyChecking=no \
                "ubuntu@$EC2_DNS" \
                "cat > '/home/ubuntu/$REPOSITORY/docker-compose.yml'"

        IMAGE="$DOCKERHUB_USERNAME/$REPOSITORY_LOWER-qa:$RUN_NUMBER"

        ssh \
          -i "/home/ubuntu/.ssh/vm-key-pair-dev.pem" \
          -o StrictHostKeyChecking=no \
          "ubuntu@$EC2_DNS" \
          "cd '/home/ubuntu/$REPOSITORY' && \
           docker pull '$IMAGE' && \
           sed -i 's|image:.*|image: $IMAGE|g' docker-compose.yml && \
           sudo docker compose down && \
           sudo docker compose up -d"