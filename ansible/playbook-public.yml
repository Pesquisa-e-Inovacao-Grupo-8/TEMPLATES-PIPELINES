
- name: Configurar servidor Ubuntu
  hosts: web
  become: true

  vars:
    node_major_version: "22"

  tasks:

    - name: Atualizar cache do apt
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Testar conexão
      ansible.builtin.ping:

    - name: Atualizar pacotes do sistema
      apt:
        upgrade: dist

    - name: Instalar dependências básicas
      apt:
        name:
          - git
          - curl
          - wget
          - unzip
          - zip
          - vim
          - nano
          - htop
          - tree
          - software-properties-common
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
          - build-essential
          - python3
          - python3-pip
          - python3-venv
        state: present

    - name: Instalar Docker
      apt:
        name:
          - docker.io
        state: present

    - name: Iniciar Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Adicionar usuário ubuntu ao grupo docker
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Instalar Docker Compose Plugin
      apt:
        name:
          - docker-compose-v2
        state: present
      ignore_errors: yes


    - name: Adicionar repositório NodeSource
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_{{ node_major_version }}.x | bash -
      args:
        executable: /bin/bash

    - name: Instalar Node.js
      apt:
        name:
          - nodejs
        state: present

    - name: Atualizar npm
      npm:
        name: npm
        global: yes
        state: latest

    - name: Verificar Node
      command: node --version
      register: node_version
      changed_when: false

    - name: Verificar npm
      command: npm --version
      register: npm_version
      changed_when: false

    - name: Verificar Python
      command: python3 --version
      register: python_version
      changed_when: false

    - name: Exibir versões instaladas
      debug:
        msg:
          - "{{ docker_version.stdout }}"
          - "{{ git_version.stdout }}"
          - "{{ node_version.stdout }}"
          - "{{ npm_version.stdout }}"
          - "{{ python_version.stdout }}"